<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  
  <!-- AWS Cloud -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#232f3e" stroke-width="2" rx="15" stroke-dasharray="5,5"/>
  <text x="40" y="45" font-family="Arial" font-size="18" fill="#232f3e" font-weight="bold">AWS Cloud</text>
  
  <!-- Region -->
  <rect x="40" y="60" width="720" height="490" fill="none" stroke="#00a4a6" stroke-width="2" rx="10" stroke-dasharray="5,5"/>
  <text x="60" y="85" font-family="Arial" font-size="16" fill="#00a4a6" font-weight="bold">Region (e.g., us-east-1)</text>

  <!-- VPC -->
  <rect x="60" y="100" width="680" height="430" fill="#ebf7f7" stroke="#3b48cc" stroke-width="2" rx="8"/>
  <text x="80" y="125" font-family="Arial" font-size="16" fill="#3b48cc" font-weight="bold">Amazon VPC (10.0.0.0/16)</text>
  
  <!-- Internet Gateway -->
  <rect x="100" y="70" width="160" height="50" fill="#ff9900" rx="5"/>
  <text x="125" y="100" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">Internet Gateway</text>

  <!-- Public Subnet -->
  <rect x="100" y="160" width="280" height="340" fill="#e6f5e9" stroke="#1d8102" stroke-width="2" rx="8"/>
  <text x="110" y="185" font-family="Arial" font-size="14" fill="#1d8102" font-weight="bold">Public Subnet (10.0.1.0/24)</text>

  <!-- NAT Gateway -->
  <rect x="140" y="220" width="160" height="50" fill="#cc2264" rx="5"/>
  <text x="175" y="250" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">NAT Gateway</text>

  <!-- Web Server / EC2 -->
  <rect x="140" y="320" width="160" height="50" fill="#ed7100" rx="5"/>
  <text x="180" y="350" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">Web Server</text>

  <!-- Private Subnet -->
  <rect x="420" y="160" width="280" height="340" fill="#eaf3fb" stroke="#005b9f" stroke-width="2" rx="8"/>
  <text x="430" y="185" font-family="Arial" font-size="14" fill="#005b9f" font-weight="bold">Private Subnet (10.0.2.0/24)</text>

  <!-- App Server / EC2 -->
  <rect x="480" y="220" width="160" height="50" fill="#ed7100" rx="5"/>
  <text x="525" y="250" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">App Server</text>

  <!-- Database / RDS -->
  <rect x="480" y="320" width="160" height="50" fill="#3b48cc" rx="5"/>
  <text x="520" y="350" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">Amazon RDS</text>

  <!-- Connection Lines (Simulated routing) -->
  <path d="M220 270 L220 320" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M560 270 L560 320" stroke="#333" stroke-width="2"/>
  <path d="M300 245 L480 245" stroke="#cc2264" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="330" y="235" font-family="Arial" font-size="12" fill="#333">NAT Traffic</text>

</svg>
