<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <!-- Defs / Styles -->
  <defs>
    <style>
      .text-title { font-family: Arial; font-size: 16px; font-weight: bold; }
      .text-sub { font-family: Arial; font-size: 14px; font-weight: bold; }
      .text-icn { font-family: Arial; font-size: 14px; font-weight: bold; fill: #333; }
      .text-center { text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cc2264" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#005b9f" />
    </marker>
  </defs>

  <!-- AWS Cloud -->
  <rect x="10" y="10" width="980" height="780" fill="#f8f9fa" stroke="#232f3e" stroke-width="2" rx="10" stroke-dasharray="5,5"/>
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/AWS-Cloud_32.svg" x="25" y="25" width="24" height="24" />
  <text x="55" y="42" class="text-title" fill="#232f3e">AWS Cloud</text>

  <!-- Region -->
  <rect x="30" y="60" width="940" height="710" fill="none" stroke="#00a4a6" stroke-width="2" rx="8" stroke-dasharray="5,5"/>
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Region_32.svg" x="45" y="75" width="24" height="24" />
  <text x="75" y="92" class="text-title" fill="#00a4a6">Region (e.g., us-east-1)</text>

  <!-- VPC -->
  <rect x="50" y="110" width="900" height="640" fill="none" stroke="#1da40a" stroke-width="3" rx="6" />
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Virtual-private-cloud-VPC_32.svg" x="65" y="125" width="24" height="24" />
  <text x="95" y="142" class="text-title" fill="#1da40a">Custom Amazon VPC</text>

  <!-- AZ A Box -->
  <rect x="70" y="170" width="420" height="560" fill="none" stroke="#005b9f" stroke-width="2" rx="6" stroke-dasharray="8,4" />
  <text x="90" y="195" class="text-title" fill="#005b9f">Availability Zone A</text>

  <!-- AZ B Box -->
  <rect x="510" y="170" width="420" height="560" fill="none" stroke="#005b9f" stroke-width="2" rx="6" stroke-dasharray="8,4" />
  <text x="530" y="195" class="text-title" fill="#005b9f">Availability Zone B</text>

  <!-- Subnets AZ A -->
  <!-- Public Subnet -->
  <rect x="90" y="220" width="380" height="140" fill="#e6f5e9" stroke="#1d8102" stroke-width="2" rx="4" />
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Public-subnet_32.svg" x="105" y="235" width="24" height="24" />
  <text x="135" y="252" class="text-sub" fill="#1d8102">Public Subnet (Web / LB)</text>
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/EC2-instance-contents_32.svg" x="260" y="270" width="40" height="40" />
  <text x="280" y="330" class="text-icn text-center">Web Server</text>

  <!-- Private Subnet (App) -->
  <rect x="90" y="380" width="380" height="140" fill="#eaf3fb" stroke="#005b9f" stroke-width="2" rx="4" />
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Private-subnet_32.svg" x="105" y="395" width="24" height="24" />
  <text x="135" y="412" class="text-sub" fill="#005b9f">Private Subnet (Application)</text>
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/EC2-instance-contents_32.svg" x="260" y="430" width="40" height="40" />
  <text x="280" y="490" class="text-icn text-center">App Server</text>

  <!-- Private Subnet (DB) -->
  <rect x="90" y="540" width="380" height="140" fill="#eaf3fb" stroke="#005b9f" stroke-width="2" rx="4" />
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Private-subnet_32.svg" x="105" y="555" width="24" height="24" />
  <text x="135" y="572" class="text-sub" fill="#005b9f">Private Subnet (Database)</text>
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Server-contents_32.svg" x="260" y="590" width="40" height="40" />
  <text x="280" y="650" class="text-icn text-center">Primary DB</text>


  <!-- Subnets AZ B -->
  <!-- Public Subnet -->
  <rect x="530" y="220" width="380" height="140" fill="#e6f5e9" stroke="#1d8102" stroke-width="2" rx="4" />
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Public-subnet_32.svg" x="545" y="235" width="24" height="24" />
  <text x="575" y="252" class="text-sub" fill="#1d8102">Public Subnet (Web / LB)</text>
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/EC2-instance-contents_32.svg" x="700" y="270" width="40" height="40" />
  <text x="720" y="330" class="text-icn text-center">Web Server</text>

  <!-- Private Subnet (App) -->
  <rect x="530" y="380" width="380" height="140" fill="#eaf3fb" stroke="#005b9f" stroke-width="2" rx="4" />
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Private-subnet_32.svg" x="545" y="395" width="24" height="24" />
  <text x="575" y="412" class="text-sub" fill="#005b9f">Private Subnet (Application)</text>
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/EC2-instance-contents_32.svg" x="700" y="430" width="40" height="40" />
  <text x="720" y="490" class="text-icn text-center">App Server</text>

  <!-- Private Subnet (DB) -->
  <rect x="530" y="540" width="380" height="140" fill="#eaf3fb" stroke="#005b9f" stroke-width="2" rx="4" />
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Private-subnet_32.svg" x="545" y="555" width="24" height="24" />
  <text x="575" y="572" class="text-sub" fill="#005b9f">Private Subnet (Database)</text>
  <image href="../../icons_aws/Architecture-Group-Icons_01302026/Server-contents_32.svg" x="700" y="590" width="40" height="40" />
  <text x="720" y="650" class="text-icn text-center">Standby DB</text>

  <!-- Connecting Lines -->
  <!-- Web to App flow -->
  <path d="M280 340 L280 375" stroke="#005b9f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow-blue)"/>
  <path d="M720 340 L720 375" stroke="#005b9f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow-blue)"/>
  
  <!-- App to DB flow -->
  <path d="M280 500 L280 535" stroke="#005b9f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow-blue)"/>
  <path d="M720 500 L720 535" stroke="#005b9f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow-blue)"/>

  <!-- DB Replication flow -->
  <path d="M350 610 L640 610" stroke="#ff9900" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="500" y="605" class="text-sub text-center" fill="#ff9900">Sync / DB Replication</text>

  <!-- Internet Gateway & Traffic -->
  <rect x="410" y="85" width="180" height="50" fill="#cc2264" rx="5"/>
  <text x="500" y="115" font-family="Arial" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">Internet Gateway</text>

  <path d="M500 20 L500 80" stroke="#cc2264" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="500" y="15" font-family="Arial" font-size="16" fill="#cc2264" font-weight="bold" text-anchor="middle">Internet Traffic</text>

</svg>
